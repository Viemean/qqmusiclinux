name: Build and Release TUI (Multi-Arch)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.arch }} package
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            deb_arch: amd64
            os: ubuntu-latest
            rid: linux-x64
          - arch: aarch64
            deb_arch: arm64
            os: ubuntu-24.04-arm
            rid: linux-arm64

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install Native Build Dependencies
        run: |
          sudo apt-get update || true
          sudo apt-get install -y --no-install-recommends libgstreamer1.0-dev clang zstd dpkg

      - name: Build and Package Arch Linux ZST (${{ matrix.arch }})
        run: |
          chmod +x ./build-pkg.sh
          VERSION="${GITHUB_REF_NAME#v}"
          if [ -z "$VERSION" ] || [ "$VERSION" = "$GITHUB_REF_NAME" ]; then
            VERSION="0.1.3"
          fi
          ./build-pkg.sh "$VERSION" 1 "${{ matrix.arch }}" "${{ matrix.rid }}"

      - name: Build and Package Debian DEB (${{ matrix.deb_arch }})
        run: |
          chmod +x ./build-deb.sh
          VERSION="${GITHUB_REF_NAME#v}"
          if [ -z "$VERSION" ] || [ "$VERSION" = "$GITHUB_REF_NAME" ]; then
            VERSION="0.1.3"
          fi
          ./build-deb.sh "$VERSION" 1 "${{ matrix.deb_arch }}" "${{ matrix.rid }}"

      - name: Upload Package Artifact
        uses: actions/upload-artifact@v4
        with:
          name: qqmusic-tui-pkg-${{ matrix.arch }}
          path: |
            qqmusic-tui-bin-*.pkg.tar.zst
            qqmusic-tui_*.deb

  build-alpine-arm64:
    name: Build Alpine aarch64 APK
    runs-on: ubuntu-24.04-arm
    continue-on-error: true
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Docker
        run: |
          curl -fsSL https://get.docker.com | sudo sh
          sudo systemctl start docker

      - name: Build and Package Alpine aarch64 APK in Docker Container
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if [ -z "$VERSION" ] || [ "$VERSION" = "$GITHUB_REF_NAME" ]; then
            VERSION="0.1.3"
          fi
          chmod +x ./build-apk.sh
          docker run --rm \
            -v "${{ github.workspace }}:/workspace" \
            -w /workspace \
            mcr.microsoft.com/dotnet/sdk:10.0-alpine \
            sh -c "apk update && apk add --no-cache bash alpine-sdk clang lld gstreamer-dev gst-plugins-base-dev && ./build-apk.sh $VERSION 1 aarch64 linux-musl-arm64"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: qqmusic-tui-apk-aarch64
          path: qqmusic-tui-*.apk

  release:
    name: Publish GitHub Release
    needs: [build, build-alpine-arm64]
    if: always() && !cancelled() && needs.build.result == 'success' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.pkg.tar.zst
            dist/*.deb
            dist/*.apk
          generate_release_notes: true

